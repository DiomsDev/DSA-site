<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bleu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b4ff"/>
      <stop offset="100%" stop-color="#0a3fd6"/>
    </linearGradient>
    <linearGradient id="argent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b8c4d6"/>
      <stop offset="100%" stop-color="#8896ad"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <circle cx="200" cy="200" r="190" fill="#06122e"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#argent)" stroke-width="8"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#bleu)" stroke-width="3"/>

  <!-- Écran -->
  <rect x="245" y="62" width="82" height="54" rx="6" fill="url(#bleu)" stroke="#e8f4ff" stroke-width="3"/>
  <rect x="279" y="116" width="14" height="10" fill="#8896ad"/>
  <rect x="262" y="126" width="48" height="6" rx="3" fill="#8896ad"/>
  <!-- Circuits -->
  <g stroke="#00b4ff" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M327 78 H350 V70"/>
    <path d="M327 90 H358"/>
    <path d="M327 102 H350 V112"/>
  </g>
  <g fill="#00b4ff">
    <circle cx="350" cy="68" r="4"/>
    <circle cx="361" cy="90" r="4"/>
    <circle cx="350" cy="114" r="4"/>
  </g>

  <!-- Lettre D -->
  <path d="M95 110 H165 A75 75 0 0 1 165 260 H95 Z" fill="none" stroke="url(#argent)" stroke-width="18" stroke-linejoin="round"/>
  <!-- SA -->
  <text x="178" y="222" font-family="Arial Black, Arial, sans-serif" font-size="78" font-weight="900" fill="url(#bleu)" stroke="#e8f4ff" stroke-width="1.5">SA</text>

  <!-- Texte -->
  <text x="200" y="312" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#argent)" letter-spacing="4">D.S.A</text>
  <text x="200" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c9d6ea">service informatique</text>
</svg>
